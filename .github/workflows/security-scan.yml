name: security-scan

# Re-runs the same two security scanners that gate PRs (ci.yml's
# `image-scan` job from #68 and `govulncheck` from `security` in #41)
# against the latest `main` SHA on a daily schedule. The goal is to
# surface CVEs disclosed against deps that have NOT changed since the
# last PR — without a periodic re-scan these are invisible until the
# next time someone bumps the affected dep. A failing scanner job
# produces a red row in the Actions list AND triggers `file-issue`
# below, which opens a labelled GitHub issue so the regression has an
# owner (see #73). The deployed-image job also scans the immutable
# digest observed on started Fly Machines, independently of main.
on:
  schedule:
    # 06:00 UTC daily. Off-peak for US/EU/JP and keeps the
    # disclosure-to-detection window under ~24h. See § Schedule
    # cadence in 72-periodic-security-scan.md for rationale.
    - cron: '0 6 * * *'
  workflow_dispatch:

# `contents: read` is the only workflow-level permission. The
# `issues: write` widening this workflow needs lives in the
# `file-issue` job below, scoped to that single job (NOT widened
# here). AC #3 on #73 mandates job-level scoping; a future
# maintainer should NOT promote `issues: write` to this block.
permissions:
  contents: read

# Coalesce overlapping runs (a manual `workflow_dispatch` firing
# while a scheduled run is in flight, or vice versa). Queueing rather
# than cancelling avoids leaving artifacts half-uploaded between the
# scanner jobs and `file-issue`.
concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  image-scan:
    runs-on: ubuntu-latest
    # Belt-and-suspenders mirror of ci.yml's image-scan job: even
    # though the workflow-level block already grants only
    # `contents: read`, a future top-level escalation must not
    # silently widen this job. Same convention as ci.yml.
    permissions:
      contents: read
    steps:
      # Explicit `ref: main` so a future change to the default-branch
      # name or a manual `workflow_dispatch` invocation from a feature
      # branch still scans `main` (the ticket's AC #2 names `main`).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: build image
        # Same artifact construction as ci.yml's image-scan job.
        run: docker build -t pyrycode-relay:${{ github.sha }} .
      # Tracks: aquasecurity/trivy-action@v0.36.0
      # Pinned by commit SHA so a tag-swap upstream cannot change
      # what runs against our image between Renovate bumps. Mirror
      # of ci.yml's image-scan pin — must move in lockstep with that
      # file when Renovate bumps the action.
      #
      # `format: json` + `output: trivy.json` differs from ci.yml's
      # `format: table`: the cron path machine-parses the output to
      # render an issue body, the PR path only needs human-readable
      # console output. Policy flags (severity, ignore-unfixed,
      # vuln-type, exit-code) are unchanged.
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: pyrycode-relay:${{ github.sha }}
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
      - name: render issue from trivy output
        if: failure()
        run: |
          set -euo pipefail
          primary_cve=$(jq -r '
            [ .Results[]?.Vulnerabilities[]? ]
            | sort_by(.Severity) | reverse | .[0].VulnerabilityID // empty
          ' trivy.json)
          primary_pkg=$(jq -r '
            [ .Results[]?.Vulnerabilities[]? ]
            | sort_by(.Severity) | reverse | .[0]
            | "\(.PkgName // "unknown")@\(.InstalledVersion // "unknown")"
          ' trivy.json)
          # If trivy.json has no parseable vulnerabilities (e.g. the
          # action failed before producing output, or produced an
          # empty results array), there is nothing to render here.
          # `file-issue` still files a generic scanner-failure issue
          # when a scanner job failed and no artifact was produced,
          # so this branch is no longer a silent red row.
          if [ -z "$primary_cve" ]; then
            echo "no parseable CVEs in trivy.json — skipping issue render"
            exit 0
          fi
          printf 'security-scan regression: %s in image package %s\n' \
            "$primary_cve" "$primary_pkg" > issue-title.txt
          {
            printf '## Periodic security-scan regression\n\n'
            printf '**Scanner:** Trivy (image scan)\n'
            printf '**Primary finding:** `%s` in `%s`\n' "$primary_cve" "$primary_pkg"
            printf '**Workflow run:** %s/%s/actions/runs/%s\n\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf '### All findings\n\n```\n'
            jq -r '
              .Results[]?.Vulnerabilities[]?
              | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)@\(.InstalledVersion)\t\(.FixedVersion // "no fix")"
            ' trivy.json | sort -u | head -100
            printf '```\n\n### Triage\n'
            printf -- '- Bump the offending dependency or base-image digest.\n'
            printf -- '- Verify the next `security-scan` workflow run is green.\n'
            printf -- '- Close this issue once the next run passes.\n'
          } > issue-body.md
      - name: upload issue artifact
        if: failure() && hashFiles('issue-title.txt') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: regression-image-scan
          path: |
            issue-title.txt
            issue-body.md
          retention-days: 7
          if-no-files-found: ignore

  deployed-image-scan:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: verify deployed scanner fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/workflows -p 'test_security_scan.py' -v
      - name: discover started image
        env:
          # Org-scoped read-only token; never use a deploy/personal token.
          FLY_READONLY_TOKEN: ${{ secrets.FLY_READONLY_TOKEN }}
        run: python3 .github/workflows/security_scan.py discover deployment.json
      - name: download immutable image archive
        env:
          FLY_READONLY_TOKEN: ${{ secrets.FLY_READONLY_TOKEN }}
        # The helper removes its temporary Docker config on success/failure
        # before this step exits. No credential is available to Trivy.
        run: python3 .github/workflows/security_scan.py download deployment.json deployed-image.tar
      # Tracks: aquasecurity/trivy-action@v0.36.0
      - name: trivy deployed image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          input: deployed-image.tar
          format: json
          output: deployed-trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          # Execution errors fail this step and skip rendering, even if
          # partial JSON exists. The next gate fails completed findings.
          exit-code: '0'
      - name: render deployed findings
        run: |
          python3 .github/workflows/security_scan.py render \
            deployed-trivy.json deployment.json . \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: upload issue artifact
        if: failure() && hashFiles('issue-title.txt') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: regression-deployed-image-scan
          path: |
            issue-title.txt
            issue-body.md
          retention-days: 7
          if-no-files-found: error

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # Tracks: golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # A semver tag rather than a commit SHA: the Go module checksum DB
      # makes a tag effectively immutable for `go install` (#41's spec).
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # `-json` exits 0 whatever it finds, so this step fails only when
      # govulncheck itself fails (package load error, DB download
      # failure). The gate step below is skipped then, no artifact is
      # written, and `file-issue` files its generic scanner-failure issue.
      - name: govulncheck
        run: |
          set -o pipefail
          govulncheck -json ./... > govulncheck.json
      # cmd/vulngate applies text-mode govulncheck's exit-3 rule: only a
      # finding whose trace reaches a called function (symbol level)
      # counts; imported- or required-only advisories do not. On such a
      # finding it writes issue-body.md and issue-title.txt and exits
      # non-zero. Malformed or truncated JSON also exits non-zero but
      # writes nothing, so it lands as the generic scanner-failure issue.
      - name: gate on called vulnerable functions
        run: |
          go run ./cmd/vulngate \
            -in govulncheck.json \
            -out . \
            -run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: upload issue artifact
        if: failure() && hashFiles('issue-title.txt') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: regression-govulncheck
          path: |
            issue-title.txt
            issue-body.md
          retention-days: 7
          if-no-files-found: ignore

  file-issue:
    needs: [image-scan, govulncheck, deployed-image-scan]
    if: failure()
    runs-on: ubuntu-latest
    # `issues: write` is granted at the JOB level — per AC #3 on #73
    # it must NOT be promoted to the workflow-level permissions block.
    # The scanner jobs above run untrusted scanner code and keep
    # `contents: read` only; this job does no scanning and only posts
    # pre-rendered content via `gh`.
    permissions:
      contents: read
      issues: write
    steps:
      - name: download regression artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          # Matches all three scanner artifacts. Missing artifacts (e.g. one
          # scanner failed for a non-CVE reason and produced no
          # artifact) are silently absent.
          pattern: regression-*
          path: artifacts
          merge-multiple: false
      - name: file issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYED_RESULT: ${{ needs.deployed-image-scan.result }}
        run: |
          set -euo pipefail
          # Locate rendered issues by their title file rather than by
          # globbing `artifacts/regression-*` directories. The glob
          # form silently matched nothing on the 2026-08-03 run
          # 30799090194 even though the artifact downloaded — the
          # extraction layout of download-artifact is not a contract —
          # so every red run since 2026-06-06 filed nothing. `find`
          # keyed on the file we wrote ourselves is layout-proof.
          filed_or_suppressed=0
          deployed_artifact=0
          while IFS= read -r title_file; do
            dir=$(dirname "$title_file")
            title=$(cat "$title_file")
            body_file="$dir/issue-body.md"
            # Use the deterministic title marker, not extraction layout.
            case "$title" in
              'security-scan regression: '*" in deployed-image package "*) deployed_artifact=1 ;;
            esac
            # Dedup: search open security-sensitive issues for one
            # whose title matches the full deterministic string we
            # are about to file. Compare actual titles exactly: search hits
            # alone can include a different/repository-image title.
            # `in:title` avoids matching unrelated
            # issues whose body happens to mention the CVE id. State
            # filter is `open` so a regression of a previously-closed
            # CVE files a fresh issue.
            existing=$(gh issue list \
              --repo "$REPO" \
              --state open \
              --label security-sensitive \
              --search "in:title \"$title\"" \
              --json title \
              --limit 1000 | jq --arg title "$title" '[.[] | select(.title == $title)] | length')
            if [ "$existing" -gt 0 ]; then
              echo "duplicate suppressed for: $title"
              filed_or_suppressed=1
              continue
            fi
            # `--body-file` (not `--body "<...>"`) so scanner-derived
            # content (CVE descriptions, package version strings with
            # backticks or `$`) never passes through shell-argument
            # expansion. Title is the rendered single-line string we
            # wrote ourselves — ASCII by construction.
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body-file "$body_file" \
              --label security-sensitive
            filed_or_suppressed=1
          done < <(find artifacts -name issue-title.txt 2>/dev/null | sort)
          # Fallback: this job only runs when a scanner failed. If no
          # rendered issue reached us (scanner died before producing
          # output, or rendering itself broke), file a generic
          # infrastructure issue instead of leaving the red Actions
          # row as the sole signal — an unwatched red row is how the
          # 2026-06-06..2026-08-03 window went unnoticed. Same
          # open-state title dedup as above, so this files once per
          # incident, not once per day.
          # A deployed scanner infrastructure failure must also be visible
          # beside other scanners' findings; leave their fallback unchanged.
          if [ "$filed_or_suppressed" -eq 0 ] || { [ "$DEPLOYED_RESULT" = failure ] && [ "$deployed_artifact" -eq 0 ]; }; then
            title="security-scan: scanner failed with no parseable findings"
            existing=$(gh issue list \
              --repo "$REPO" \
              --state open \
              --label security-sensitive \
              --search "in:title \"$title\"" \
              --json title \
              --limit 1000 | jq --arg title "$title" '[.[] | select(.title == $title)] | length')
            if [ "$existing" -gt 0 ]; then
              echo "duplicate suppressed for: $title"
            else
              {
                printf '## Periodic security-scan infrastructure failure\n\n'
                printf 'A scanner job failed but produced no parseable findings artifact,\n'
                printf 'so there is no CVE to name. Read the run log to see which job died\n'
                printf 'and why (scanner crash, DB download failure, or a rendering bug).\n\n'
                printf '**Workflow run:** %s/%s/actions/runs/%s\n' \
                  "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
              } > infra-issue-body.md
              gh issue create \
                --repo "$REPO" \
                --title "$title" \
                --body-file infra-issue-body.md \
                --label security-sensitive
            fi
          fi
