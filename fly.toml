# Fly.io manifest for pyrycode-relay.
#
# Decisions encoded here (see docs/architecture.md § Hosting):
#   - Fly is a TCP-passthrough substrate; TLS terminates in the relay
#     binary via autocert (#9). NO Fly HTTP proxy or Fly-managed certs.
#   - Port 80 carries ACME HTTP-01 challenge traffic and the explicit
#     404 fallback for non-challenge requests (ADR-0002). Both arrive at
#     the relay verbatim — Fly must not insert any HTTP handler.
#   - Single-machine hard cap. The relay's connection registry is
#     in-process; multi-instance silently routes phones to the wrong
#     replica. See docs/architecture.md § Single-instance constraint.
#     `flyctl scale count > 1` violates this invariant — the platform
#     itself does not enforce a ceiling, so operator discipline plus
#     the in-binary self-check (#65) is the load-bearing control.

app = "pyrycode-relay"
primary_region = "arn"   # operator fills at bootstrap; see docs/deploy.md.

[env]
  # Asserts single-instance intent to the #65 self-check, which would
  # otherwise refuse to boot on Fly's multi-instance-capable substrate.
  PYRYCODE_RELAY_SINGLE_INSTANCE = "1"

[build]
  dockerfile = "Dockerfile"

# --domain and --cert-cache passed as literal argv (distroless has no
# shell; env-var expansion into argv is not available). A domain change
# is a one-line edit to this file — config, not code — and rides the
# next deploy.
[processes]
  # `--http-listen=:8080` + `--https-listen=:8443` match the high-port
  # pattern documented as the canonical Fly recipe in docs/deploy.md:
  # the binary runs as nonroot (distroless `:nonroot` Dockerfile, uid
  # 65532) and can't bind privileged ports < 1024. Fly's TCP passthrough
  # then forwards external 80/443 → internal 8080/8443 (see the matching
  # `internal_port` settings in the [[services]] blocks below).
  #
  # `--https-proxy-protocol` pairs with the `proxy_proto` handler on the
  # 443 port below (#110): the relay reads Fly's PROXY v2 header before
  # TLS so the per-IP rate limiter keys on the real client IP.
  app = "--domain pyrycode-relay.pyryco.de --cert-cache /var/lib/relay/autocert --http-listen=:8080 --https-listen=:8443 --https-proxy-protocol"

[[mounts]]
  source = "relay_autocert"
  destination = "/var/lib/relay/autocert"
  # initial_size omitted; default is sufficient for autocert's
  # account-key + per-domain cert (≤ a few KiB). Resize is operator-side.

# Raw TCP services. NO `handlers = ["http"]` / `handlers = ["tls"]` —
# either would terminate at Fly's edge and break autocert. The one
# handler allowed is `proxy_proto` on 443 (see that port's comment).
[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 8080   # relay binds :8080 internally (nonroot can't bind :80); Fly forwards external :80 → internal :8080.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 80
    # handlers omitted on purpose: an unset list is pass-through. An
    # explicit `handlers = ["http"]` here would steal port 80 from the
    # autocert HTTP-01 listener and ADR-0002's 404 fallback.

  # TCP, not HTTP: no port a Fly check can reach serves `/healthz`. 8080
  # 404s everything but ACME (ADR-0002), and 8443 requires a PROXY v2
  # header that Fly's checker does not send. The 8443 service has no
  # check on purpose: a TCP probe there fails in the TLS path of a server
  # with no ErrorLog and logs a line per probe. Checking 8080 covers 443
  # too: a boot refusal exits before either listener binds, and a failed
  # listener drains the process, taking both ports down together.
  # A failing check pulls port 80 from Fly's proxy on this one-machine
  # fleet, so the timings are generous; boot is local-only and sub-second.
  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"

[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 8443   # relay binds :8443 internally (nonroot can't bind :443); Fly forwards external :443 → internal :8443.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 443
    # `proxy_proto` is the only handler allowed here: it prepends a PROXY
    # protocol v2 header carrying the client's address and otherwise
    # passes the TCP stream through, so TLS still terminates in the relay
    # via autocert. Without it the relay sees only Fly's proxy address and
    # every client shares one rate-limit bucket (#110). Any other handler
    # (e.g. ["tls"]) would terminate TLS at Fly's edge and require a
    # Fly-managed cert, bypassing autocert.
    #
    # This handler and `--https-proxy-protocol` in [processes] must deploy
    # and roll back together: handler on / flag off feeds the header to TLS
    # as garbage; flag on / handler off refuses every connection. Both
    # mismatches fail closed on 443.
    handlers = ["proxy_proto"]
    proxy_proto_options = { version = "v2" }

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[deploy]
  # `rolling` updates machines one at a time and waits for each one's
  # checks, so a relay that refuses to boot fails the deploy. `immediate`
  # replaces machines without waiting for checks. On this one-machine
  # fleet rolling updates in place and never creates a second machine,
  # so the single-instance invariant holds. A brief drop in availability
  # during deploy is acceptable (clients reconnect; no state to drain).
  strategy = "rolling"
  # Redundant with a 1-machine fleet, but documents intent.
  max_unavailable = 1
